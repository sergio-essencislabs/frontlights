name: Pilot checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  helpers:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts tests
      - run: python scripts/frontlights.py validate-plan --plan examples/plan.json
      - run: python scripts/frontlights.py schedule --plan examples/plan.json --limit 2
